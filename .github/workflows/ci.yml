name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      # With python-version set, setup-uv creates and activates a .venv itself.
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv pip install -e ".[dev]"
      - run: python -m ruff check src tests streamlit_app.py
      # The suite uses deterministic fakes for the embedder, reranker and LLM,
      # so it needs no GPU, network or API key and finishes in seconds.
      - run: python -m pytest
