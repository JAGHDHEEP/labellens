name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv venv && uv pip install -e ".[dev]"
      - run: uv run ruff check src tests
      # The suite uses deterministic fakes for the embedder, reranker and LLM,
      # so it needs no GPU, network or API key and finishes in seconds.
      - run: uv run pytest
