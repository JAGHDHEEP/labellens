[project]
name = "labellens"
version = "0.1.0"
description = "Evidence-grounded question answering over FDA drug labels: hybrid retrieval, reranking, verified citations, calibrated abstention, and a measured evaluation harness."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "numpy>=1.26",
    "pydantic>=2.6",
    "fastembed>=0.4",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
anthropic = ["anthropic>=1.0"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
labellens = "labellens.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/labellens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "B905"]
